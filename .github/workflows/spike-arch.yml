name: Spike Arch (Phase 13 A2 check)

# Phase 13 A2 (docs/roadmap/phase-13.md), checked on Arch before its pull request: this branch's
# devid, built here, runs scripts/linux-e2e.sh on an Arch VM set up like a desktop install
# (spike/arch/prepare.sh: NetworkManager, systemd-resolved off). Only on spike/arch-* branches;
# it publishes nothing.

on:
  push:
    branches: ['spike/arch-**']
    paths-ignore: ['docs/**']
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: spike-arch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  arch-e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools >/dev/null
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin devid
      - name: Boot Arch's cloud image under QEMU/KVM
        run: spike/arch/vm.sh boot
      - name: Packages, and NetworkManager with systemd-resolved off, as on a desktop
        run: |
          spike/arch/vm.sh copy spike/arch/prepare.sh prepare.sh
          spike/arch/vm.sh ssh 'sudo bash prepare.sh' 2>&1 | sed -nE '/^(\+ |::|  |\(|.*downloading|checking|loading|installing|upgrading|resolving|looking|Packages|Total|Net)/!p' | tail -30
          spike/arch/vm.sh ssh 'sudo systemctl reboot' || true
          spike/arch/vm.sh wait
          spike/arch/vm.sh ssh 'systemctl is-active NetworkManager systemd-resolved; ls -l /etc/resolv.conf; cat /etc/resolv.conf'
      - name: This branch's devid and the e2e script
        run: |
          spike/arch/vm.sh copy target/x86_64-unknown-linux-musl/release/devid devid
          spike/arch/vm.sh copy scripts/linux-e2e.sh linux-e2e.sh
          spike/arch/vm.sh ssh 'chmod +x devid && ./devid --version'
      - name: The dry runs before anything ran (0.19 stopped at "no Devid CA yet")
        run: spike/arch/vm.sh ssh './devid helper install --dry-run && ./devid setup --dry-run'
      - name: linux-e2e.sh on Arch
        run: spike/arch/vm.sh ssh 'bash linux-e2e.sh ./devid'
      - name: The state after uninstall
        if: always()
        run: |
          spike/arch/vm.sh ssh 'ls -l /etc/resolv.conf* /etc/devid-resolved.state 2>&1; cat /etc/resolv.conf; systemctl is-enabled systemd-resolved; systemctl is-active systemd-resolved systemd-resolved-varlink.socket systemd-resolved-monitor.socket; ls /etc/ca-certificates/trust-source/anchors/' || true
          tail -30 vm/serial.log || true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: a2-arch-serial
          path: vm/serial.log
