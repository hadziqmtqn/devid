name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Linux keeps CI cheap (macOS minutes cost 10x); the tests use fake php/php-fpm/nginx
    # scripts, so they do not need the macOS PHP builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gui:
    # The desktop app (crates/gui, Phase 7) is not a default member, so the job above skips it.
    # It ships for macOS only, but Linux compiles and lints all of it except a few
    # `cfg(target_os = "macos")` lines, at a tenth of the cost. Those lines build on the
    # owner's Mac and in the release build (G4).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - run: cargo clippy -p devid-gui --all-targets -- -D warnings
      - run: cargo test -p devid-gui

  linux-e2e:
    # Devid on Linux end to end (Phase 12 L3, D-057): the static musl build runs `devid setup` with
    # its real root step (the runner allows sudo), serves a site over HTTPS to curl and headless
    # Chrome, and `devid uninstall --purge` puts every file back. It downloads PHP and nginx from
    # runtime-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # certutil (libnss3-tools) is Chrome's step; a desktop may lack it, and setup says so then.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools libnss3-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin devid
      - run: scripts/linux-e2e.sh target/x86_64-unknown-linux-musl/release/devid
