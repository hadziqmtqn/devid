name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # Linux keeps CI cheap (macOS minutes cost 10x); the tests use fake php/php-fpm/nginx
    # scripts, so they do not need the macOS PHP builds.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test

  gui:
    # The desktop app (crates/gui, Phase 7) is not a default member, so the job above skips it.
    # It ships for macOS only, but Linux compiles and lints all of it except a few
    # `cfg(target_os = "macos")` lines, at a tenth of the cost. Those lines build on the
    # owner's Mac and in the release build (G4).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev
      - uses: Swatinem/rust-cache@v2
        with:
          key: gui
      - run: cargo clippy -p devid-gui --all-targets -- -D warnings
      - run: cargo test -p devid-gui

  db-e2e:
    # Phase 14 (D-061): the daemon installs MySQL, PostgreSQL and MongoDB from devid-binaries'
    # db-latest, runs them and gives Devid its own way in, with the real builds; no sudo.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          key: db-e2e
      - run: cargo build --bin devid
      - run: scripts/db-e2e.sh target/debug/devid

  linux-e2e:
    # Devid on Linux end to end (Phase 12 L3, D-057): the static musl build runs `devid setup` with
    # its real root step (the runner allows sudo), serves a site over HTTPS to curl and headless
    # Chrome, and `devid uninstall --purge` puts every file back. It downloads PHP and nginx from
    # runtime-latest.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      # certutil (libnss3-tools) is Chrome's step; a desktop may lack it, and setup says so then.
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools libnss3-tools
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin devid
      - run: scripts/linux-e2e.sh target/x86_64-unknown-linux-musl/release/devid

  arch-e2e:
    # The same end to end on Arch (Phase 13 A3, D-059), in a VM on the runner: Arch's cloud image
    # under QEMU/KVM, set up like a desktop install (NetworkManager, systemd-resolved off). There
    # setup turns systemd-resolved on and trusts the CA through p11-kit, and uninstall must put
    # /etc/resolv.conf and systemd-resolved back as they were. About five minutes.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo rm -f /var/lib/man-db/auto-update && sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends musl-tools
        timeout-minutes: 10
      - uses: Swatinem/rust-cache@v2
        with:
          key: musl
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin devid
      - name: Boot Arch, set up like a desktop
        run: scripts/arch-vm.sh boot
        timeout-minutes: 15
      - name: Setup, a site over HTTPS, and uninstall on Arch
        run: scripts/arch-vm.sh e2e target/x86_64-unknown-linux-musl/release/devid
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: arch-vm-serial-log
          path: vm/serial.log
