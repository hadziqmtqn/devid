[workspace]
resolver = "3"
members = ["crates/daemon", "crates/cli", "crates/gui"]
# The desktop app builds only on request (`-p devid-gui`), so the daemon and CLI stay fast to build.
default-members = ["crates/daemon", "crates/cli"]

[workspace.package]
version = "0.12.3"
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
clap = { version = "4", features = ["derive"] }

[profile.release]
opt-level = "s"
lto = true
strip = true
