[package]
name = "devid-gui"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

# The desktop app (Phase 7, D-023/D-026). Not a default member: a plain
# `cargo build` or `cargo test` never compiles Tauri. Build it with `-p devid-gui`.

[features]
# Tauri's production mode, for Devid.app (scripts/bundle-app.sh).
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2.7.4", default-features = false }

[dependencies]
devid-daemon = { path = "../daemon" }
serde.workspace = true
serde_json.workspace = true
# No default features: no asset compression, no runtime ACL, no Linux X11/D-Bus.
tauri = { version = "2.12.5", default-features = false, features = ["wry", "tray-icon"] }

[target.'cfg(target_os = "macos")'.dependencies]
# New-mail notifications (D-050). Both are already in Tauri's tree; NSUserNotification is the only new feature.
objc2 = "0.6.5"
objc2-foundation = { version = "0.3.2", default-features = false, features = ["std", "NSBundle", "NSObject", "NSString", "NSUserNotification"] }
