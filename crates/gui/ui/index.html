<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Devid</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="dv-app">
  <aside class="dv-side">
    <div class="dv-lights" data-tauri-drag-region></div>
    <nav aria-label="Sections">
      <button type="button" class="dv-nav is-active" aria-current="page">
        <svg class="dv-ico" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.2"></circle><ellipse cx="8" cy="8" rx="2.7" ry="6.2"></ellipse><path d="M2 8h12"></path></svg>
        <span class="dv-grow">Sites</span><span class="dv-chip muted" id="nav-sites"></span>
      </button>
      <button type="button" class="dv-nav" disabled>
        <svg class="dv-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M5 4 1.5 8 5 12M11 4l3.5 4L11 12M9.3 2.8 6.7 13.2"></path></svg>
        <span class="dv-grow">PHP</span><span class="dv-chip muted" id="nav-php"></span>
      </button>
      <button type="button" class="dv-nav" disabled>
        <svg class="dv-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="4.5" rx="1.3"></rect><rect x="2" y="9" width="12" height="4.5" rx="1.3"></rect><circle class="f" cx="4.8" cy="4.75" r=".9"></circle><circle class="f" cx="4.8" cy="11.25" r=".9"></circle></svg>
        <span class="dv-grow">Web Server</span>
      </button>
      <button type="button" class="dv-nav" disabled>
        <svg class="dv-ico" viewBox="0 0 16 16" aria-hidden="true"><rect x="3" y="1.8" width="10" height="12.4" rx="1.6"></rect><path d="M5.5 5.5h5M5.5 8h5M5.5 10.5h3"></path></svg>
        <span class="dv-grow">Logs</span>
      </button>
      <button type="button" class="dv-nav" disabled>
        <svg class="dv-ico" viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h7M12.5 4.5h1M2.5 11.5h1M6.5 11.5h7"></path><circle cx="11" cy="4.5" r="1.6"></circle><circle cx="5" cy="11.5" r="1.6"></circle></svg>
        <span class="dv-grow">Settings</span>
      </button>
    </nav>
    <div class="dv-statuscard">
      <span class="dv-dot" id="status-dot"></span>
      <div class="dv-grow">
        <div class="dv-strong" id="status-server">Devid</div>
        <div class="dv-sub" id="status-line">Connecting…</div>
      </div>
    </div>
  </aside>

  <main class="dv-main">
    <header class="dv-toolbar" data-tauri-drag-region>
      <h1 data-tauri-drag-region>Sites</h1>
      <div class="dv-sub" data-tauri-drag-region>Every site is served at https://name.test with a local certificate.</div>
    </header>
    <div class="dv-scroll">
      <div class="dv-wrap">
        <div class="dv-banner" id="error" role="status" hidden>
          <span class="dv-dot bad"></span>
          <div class="dv-grow"><div class="dv-strong">Devid is not running</div><div class="dv-sub" id="error-msg"></div></div>
        </div>

        <h2 class="dv-h2">Parked folders <span class="dv-light" id="parked-count"></span></h2>
        <div class="dv-sub dv-note">Every folder inside a parked folder is served automatically at <b>folder-name</b>.test</div>
        <div class="dv-card" id="parked"></div>

        <h2 class="dv-h2">Sites <span class="dv-light" id="sites-count"></span></h2>
        <div class="dv-card" id="sites"></div>
        <p class="dv-sub dv-note">Each site picks its PHP version; a change reloads only that site.</p>
      </div>
    </div>
  </main>
</div>

<template id="parked-row">
  <div class="dv-row">
    <span class="dv-avatar folder" aria-hidden="true"><svg class="dv-ico" viewBox="0 0 16 16"><path d="M1.8 4.2a1.2 1.2 0 0 1 1.2-1.2h3.3l1.5 1.5H13a1.2 1.2 0 0 1 1.2 1.2v6.6A1.2 1.2 0 0 1 13 13.5H3a1.2 1.2 0 0 1-1.2-1.2z"></path></svg></span>
    <div class="dv-grow"><div class="dv-mono dv-ellipsis" data-path></div><div class="dv-sub" data-count></div></div>
  </div>
</template>

<template id="site-row">
  <div class="dv-row">
    <span class="dv-avatar" aria-hidden="true" data-initial></span>
    <div class="dv-grow">
      <div class="dv-line"><span class="dv-host dv-ellipsis" data-host></span><span class="dv-chip accent" data-isolated title="This site uses its own PHP version" hidden>Isolated</span></div>
      <div class="dv-sub dv-ellipsis"><span class="dv-mono" data-path></span> · <span data-kind></span></div>
    </div>
    <span class="dv-chip warn" data-missing hidden></span>
    <span class="dv-vbadge" data-php></span>
  </div>
</template>
</body>
</html>
