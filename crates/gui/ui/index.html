<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Devid</title>
<link rel="stylesheet" href="app.css">
<script src="app.js" defer></script>
</head>
<body>
<div class="dv-app">
  <aside class="dv-side">
    <div class="dv-lights" data-tauri-drag-region></div>
    <nav aria-label="Sections" id="nav"></nav>
    <div class="dv-statuscard">
      <div class="dv-statusline">
        <span class="dv-dot" id="status-dot"></span>
        <div class="dv-grow">
          <div class="dv-strong" id="status-server">Devid</div>
          <div class="dv-sub" id="status-line">Connecting…</div>
        </div>
        <div id="status-more"></div>
      </div>
      <div class="dv-statusbtns" id="status-btns"></div>
    </div>
  </aside>

  <main class="dv-main">
    <header class="dv-toolbar" data-tauri-drag-region>
      <div class="dv-tools" id="lead"></div>
      <div class="dv-grow" data-tauri-drag-region>
        <h1 id="title" data-tauri-drag-region></h1>
        <div class="dv-sub dv-ellipsis" id="subtitle" data-tauri-drag-region></div>
      </div>
      <div class="dv-tools" id="tools"></div>
    </header>
    <div class="dv-scroll">
      <div class="dv-wrap" id="page"></div>
    </div>
  </main>
</div>
<div class="dv-overlay" id="overlay" hidden></div>
<div class="dv-toasts" id="toasts" aria-live="polite"></div>
</body>
</html>
